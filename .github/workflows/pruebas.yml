name: Pruebas

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [sqlite, mariadb]
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: raiz
          MARIADB_DATABASE: sede
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl, pdo_sqlite, pdo_mysql, mbstring, intl, gd, zip, fileinfo, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Pruebas (SQLite)
        if: matrix.base == 'sqlite'
        run: php artisan test
      - name: Pruebas (MariaDB)
        if: matrix.base == 'mariadb'
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sede
          DB_USERNAME: root
          DB_PASSWORD: raiz
        run: php artisan test
